{% extends "base.html" %}
{% block content %}
  <style>
    .card-container {
      max-width: 700px;
      margin: 50px auto;
      background: #ffffff;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      margin-bottom: 100px;
    }
    .card-header {
      background-color: #002d6b;
      color: white;
      text-align: center;
      font-size: 20px;
      font-weight: bold;
      padding: 15px;
      border-top-left-radius: 10px;
      border-top-right-radius: 10px;
    }
    .form-container {
      padding: 20px;
    }
    .form-footer {
      margin-top: 20px;
      display: flex;
      justify-content: flex-end;
      gap: 10px;
    }
  </style>
  
  <div class="container">
    <div class="card-container">
      <div class="card-header">
        Add New Data
      </div>
      <div class="card-body form-container">
        <form id="addFacilityForm">
            <div class="row">
              <div class="col-md-6 mb-3">
                <label for="departmentCode" class="form-label fw-bold">Department Code</label>
                <input type="text" class="form-control" id="departmentCode" placeholder="E.g., CS101" required>
              </div>
              <div class="col-md-6 mb-3">
                <label for="departmentName" class="form-label fw-bold">Department Name</label>
                <select id="department" name="department" class="form-control" required>
                  <option value="">Select Department</option>
                  <option value="Applied Mathematics">Applied Mathematics</option>
                  <option value="BSMED">Bharathiar School of Management and Entrepreneur Development (BSMED)</option>
                  <option value="Biotechnology">Biotechnology</option>
                  <option value="Biochemistry">Biochemistry</option>
                  <option value="Botany">Botany</option>
                  <option value="Bio-Informatics">Bio-Informatics</option>
                  <option value="Chemistry">Chemistry</option>
                  <option value="Commerce">Commerce</option>
                  <option value="Computer Science">Computer Science</option>
                  <option value="Computer Application">Computer Application</option>
                  <option value="Communication and Media Studies">Communication and Media Studies</option>
                  <option value="Electronics and Instrumentation">Electronics and Instrumentation</option>
                  <option value="Economics">Economics</option>
                  <option value="Educational Technology">Educational Technology</option>
                  <option value="Education">Education</option>
                  <option value="Extension, Career Guidance, and Student Welfare">Extension, Career Guidance, and Student Welfare</option>
                  <option value="English and Foreign Language">English and Foreign Language</option>
                  <option value="Environmental Science">Environmental Science</option>
                  <option value="History">History</option>
                  <option value="Human Genetics and Molecular Biology">Human Genetics and Molecular Biology</option>
                  <option value="Information Technology">Information Technology</option>
                  <option value="Library & Information Science">Library & Information Science</option>
                  <option value="Linguistics">Linguistics</option>
                  <option value="Microbial - Biotechnology">Microbial - Biotechnology</option>
                  <option value="Mathematics">Mathematics</option>
                  <option value="Medical Physics">Medical Physics</option>
                  <option value="Nano Science and Technology">Nano Science and Technology</option>
                  <option value="Physical Education">Physical Education</option>
                  <option value="Psychology">Psychology</option>
                  <option value="Physics">Physics</option>
                  <option value="Statistics">Statistics</option>
                  <option value="Social Work">Social Work</option>
                  <option value="Sociology and Population Studies">Sociology and Population Studies</option>
                  <option value="Tamil">Tamil</option>
                  <option value="Textiles and Apparel Design">Textiles and Apparel Design</option>
                  <option value="Women's Studies">Women's Studies</option>
                  <option value="Zoology">Zoology</option>
                  <option value="Education (SDE)">Education (SDE)</option>
                  <option value="CDOE">Centre for Distance and Online Education (CDOE)</option>
                  <option value="BU-PG Extension Centre, Erode">BU-PG Extension Centre, Erode</option>
                </select>
              </div>
              <div class="col-md-6 mb-3">
                <label for="roomType" class="form-label fw-bold">Room Type</label>
                <select id="roomType" name="roomType" class="form-control" required>
                  <option value="">Select Room Type</option>
                  <option value="Seminar Hall">Seminar Hall</option>
                  <option value="Classroom">Classroom</option>
                  <option value="Lab">Lab</option>
                </select>
              </div>
              <div class="col-md-6 mb-3">
                <label for="roomNo" class="form-label fw-bold">Room No</label>
                <input type="text" class="form-control" id="roomNo" placeholder="E.g., 101" required>
              </div>
              <div class="col-md-6 mb-3">
                <label for="ictFacility" class="form-label fw-bold">Type of ICT Facility</label>
                <input type="text" class="form-control" id="ictFacility" placeholder="E.g., Projector, Wi-Fi" required>
              </div>
              <div class="col-md-6 mb-3">
                <label for="geoTagLink" class="form-label fw-bold">Geo-tagged Photo</label>
                <input type="url" class="form-control" id="geoTagLink" placeholder="Enter URL">
              </div>
              <div class="col-md-6 mb-3">
                <label for="timetableLink" class="form-label fw-bold">Master Time Table</label>
                <input type="url" class="form-control" id="timetableLink" placeholder="Enter URL">
              </div>
            </div>
        
            <div class="text-center">
              <button type="button" class="btn btn-danger px-4">Cancel</button>
              <button type="submit" class="btn btn-primary px-4">Submit</button>
            </div>
          </form>
      </div>
    </div>
  </div>
  {% endblock %}
