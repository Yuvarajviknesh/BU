{% extends "base.html" %}
{% block content %}
  <style>
    .card-container {
      max-width: 700px;
      margin: 50px auto;
      background: #ffffff;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      margin-bottom: 100px;
    }
    .card-header {
      background-color: #002d6b;
      color: white;
      text-align: center;
      font-size: 20px;
      font-weight: bold;
      padding: 15px;
      border-top-left-radius: 10px;
      border-top-right-radius: 10px;
    }
    .form-container {
      padding: 20px;
    }
    .form-footer {
      margin-top: 20px;
      display: flex;
      justify-content: flex-end;
      gap: 10px;
    }
  </style>
  <div class="container">
    <div class="card-container">
      <div class="card-header">
        Add New Data
      </div>
      <div class="card-body form-container">
        <form id="addFacilityForm">
            <div class="row">
              <div class="col-md-6 mb-3">
                <label for="nameTeacher" class="form-label fw-bold">Name of the Teacher</label>
                <input type="text" class="form-control" id="nameTeacher" placeholder="E.g., Dr. Suresh Kumar" required>
              </div>
              <div class="col-md-6 mb-3">
                <label for="moduleName" class="form-label fw-bold">Name of the Module Developed</label>
                <input type="text" class="form-control" id="moduleName" placeholder="E.g., Data Science Basics" required>
              </div>
              <div class="col-md-6 mb-3">
                <label for="platform" class="form-label fw-bold">Platform on Which Module is Developed</label>
                <input type="text" class="form-control" id="platform" placeholder="E.g., Moodle" required>
              </div>
              <div class="col-md-6 mb-3">
                <label for="launchDate" class="form-label fw-bold">Date of Launching E-Content</label>
                <input type="date" class="form-control" id="launchDate" required>
              </div>
              <div class="col-md-6 mb-3">
                <label for="docLink" class="form-label fw-bold">Link to Relevant Document and Facility</label>
                <input type="url" class="form-control" id="docLink" placeholder="Enter URL" required>
              </div>
              <div class="col-md-6 mb-3">
                <label for="facilityList" class="form-label fw-bold">List of E-Content Development Facility Available</label>
                <input type="text" class="form-control" id="facilityList" placeholder="E.g., Media Centre, Lecture Capturing System" required>
              </div>
              <div class="col-md-6 mb-3">
                <label for="videoLink" class="form-label fw-bold">Provide Link to Videos</label>
                <input type="url" class="form-control" id="videoLink" placeholder="Enter URL" required>
              </div>
            </div>
        
            <div class="text-center">
              <button type="button" class="btn btn-danger px-4">Cancel</button>
              <button type="submit" class="btn btn-primary px-4">Submit</button>
            </div>
          </form>
      </div>
    </div>
  </div>
  {% endblock %}
