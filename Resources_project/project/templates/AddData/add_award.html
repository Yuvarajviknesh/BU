{% extends "base.html" %}
{% block content %}
<style>
  .section-title {
    font-size: 18px;
    font-weight: bold;
    margin-top: 20px;
    color: #002d6b;
  }
  .form-label {
    font-weight: bold;
  }
  .container {
    max-width: 1200px;
    margin: auto;
  }
</style>

<div class="container">
  <!-- Full Page Form -->
  <h2 class="text-center my-4" style="color: #002d6b;">Add Award</h2>
  <form method="POST" enctype="multipart/form-data">
    {% csrf_token %}
    {% if messages %}
      {% for message in messages %}
        <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
          {{ message }}
          <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
      {% endfor %}
    {% endif %}
    <div class="row">
      {% if user.is_superuser %}
      <div class="col-md-6 mb-3">
        <label class="form-label fw-bold">Select Department</label>
        <select name="department_code" class="form-control" required>
          <option value="">-- Select --</option>
          {% for dept in departments %}
          <option value="{{ dept.department_code }}">{{ dept.department_name }}</option>
          {% endfor %}
        </select>
      </div>
      {% endif %}

      <div class="col-md-6 mb-3">
        <label class="form-label">Title of the Innovation</label>
        <input type="text" class="form-control" name="innovation_title" placeholder="Enter Innovation Title" required>
      </div>

      <div class="col-md-6 mb-3">
        <label class="form-label">Name of the Awardee</label>
        <input type="text" class="form-control" name="awardee_name" placeholder="Enter Awardee Name" required>
      </div>

      <div class="col-md-6 mb-3">
        <label class="form-label">Awarding Agency (with Contact)</label>
        <input type="text" class="form-control" name="awarding_agency" placeholder="Enter Awarding Agency" required>
      </div>

      <div class="col-md-6 mb-3">
        <label class="form-label">Year of Award</label>
        <input type="number" class="form-control" name="award_year" placeholder="Enter Year (e.g., 2024)" min="1900" max="2100" required>
      </div>

      <div class="col-md-6 mb-3">
        <label class="form-label">Category</label>
        <select name="category" class="form-control" required>
          <option value="" disabled selected>Select Category</option>
          <option value="Institution">Institution</option>
          <option value="Teacher">Teacher</option>
          <option value="Research Scholar">Research Scholar</option>
          <option value="Student">Student</option>
        </select>
      </div>

      <div class="col-md-6 mb-3">
        <label class="form-label">Upload Supporting Document</label>
        <input type="file" class="form-control" name="document" accept=".pdf, .jpg, .png, .jpeg" required>
      </div>
    </div>
    <div class="text-center">
      <button type="reset" class="btn btn-danger px-4" onclick="window.history.back();">Cancel</button>
      <button type="submit" class="btn btn-primary px-4">Submit</button>
    </div>
  </form>
  <hr class="my-4">

  <!-- Bulk Upload Form -->
  <h2 class="text-center my-4" style="color: #002d6b;">Bulk Upload Awards</h2>
  <form method="POST" enctype="multipart/form-data">
    {% csrf_token %}
    <div class="row">
      <div class="col-md-12 mb-3 text-center">
        <label class="form-label fw-bold">Upload Excel File</label>
        <input type="file" class="form-control" name="bulk_upload" accept=".xlsx, .xls" required>
      </div>
    </div>
    <div class="text-center">
      <!-- Link to download sample Excel file -->
      <a href="" class="btn btn-success px-4">Download Sample Excel</a>
      <button type="submit" class="btn btn-primary px-4">Upload</button>
    </div>
  </form>
  <br/><br/><br/>
</div>
{% endblock %}
