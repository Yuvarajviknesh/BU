{% extends "base.html" %}
{% block content %}
<style>
  .card-container {
    max-width: 900px;
    margin: 50px auto;
    background: #ffffff;
    padding: 20px;
    border-radius: 10px;
    box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
  }
  .card-header {
    background-color: #002d6b;
    color: white;
    text-align: center;
    font-size: 20px;
    font-weight: bold;
    padding: 15px;
    border-top-left-radius: 10px;
    border-top-right-radius: 10px;
  }
  .form-footer {
    margin-top: 20px;
    display: flex;
    justify-content: center;
    gap: 10px;
  }
</style>

<div class="container">
  <div class="card-container">
    <div class="card-header">
      Add Career Counseling and Guidance Activity
    </div>
    <div class="card-body">
      <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}
        <div class="row">
          <div class="col-md-6 mb-3">
            <label for="year" class="form-label fw-bold">Year</label>
            <input type="number" class="form-control" id="year" name="year" placeholder="Enter Year (e.g., 2023)" required>
          </div>
          <div class="col-md-12 mb-3">
            <label for="competitiveActivity" class="form-label fw-bold">Activity for Competitive Exams</label>
            <textarea class="form-control" id="competitiveActivity" name="competitive_activity" rows="2" placeholder="Enter Activity Name"></textarea>
          </div>
          <div class="col-md-6 mb-3">
            <label for="competitiveStudents" class="form-label fw-bold">Number of Students (Competitive Exams)</label>
            <input type="number" class="form-control" id="competitiveStudents" name="competitive_students" placeholder="Number of Students">
          </div>
          <div class="col-md-12 mb-3">
            <label for="careerCounselingActivity" class="form-label fw-bold">Activity for Career Counseling</label>
            <textarea class="form-control" id="careerCounselingActivity" name="career_counseling_activity" rows="2" placeholder="Enter Activity Name"></textarea>
          </div>
          <div class="col-md-6 mb-3">
            <label for="counselingStudents" class="form-label fw-bold">Number of Students (Career Counseling)</label>
            <input type="number" class="form-control" id="counselingStudents" name="counseling_students" placeholder="Number of Students">
          </div>
          <div class="col-md-6 mb-3">
            <label for="placedStudents" class="form-label fw-bold">Number of Students Placed</label>
            <input type="number" class="form-control" id="placedStudents" name="placed_students" placeholder="Number of Students Placed">
          </div>
          <div class="col-md-12 mb-3">
            <label for="relevantDocument" class="form-label fw-bold">Link to Relevant Document</label>
            <input type="url" class="form-control" id="relevantDocument" name="relevant_document" placeholder="Enter Document Link">
          </div>
        </div>
        <div class="form-footer">
          <button type="button" class="btn btn-danger px-4" onclick="window.history.back();">Cancel</button>
          <button type="submit" class="btn btn-primary px-4">Save</button>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
