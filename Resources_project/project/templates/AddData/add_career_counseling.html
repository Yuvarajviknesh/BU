{% extends "base.html" %}
{% block content %}
<style>
  .section-title {
    font-size: 18px;
    font-weight: bold;
    margin-top: 20px;
    color: #002d6b;
  }
  .form-label {
    font-weight: bold;
  }
  .container {
    max-width: 1200px;
    margin: auto;
  }
</style>

<div class="container">
  <!-- Form Title -->
  <h2 class="text-center my-4" style="color: #002d6b;">Add Career Counseling and Guidance Activity</h2>

  <!-- Main Form -->
  <form method="POST" enctype="multipart/form-data">
    {% csrf_token %}
    {% if messages %}
      {% for message in messages %}
        <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
          {{ message }}
          <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
      {% endfor %}
    {% endif %}
    <div class="row">
      <div class="col-md-6 mb-3">
        <label class="form-label fw-bold">Year</label>
        <input type="number" class="form-control" name="year" placeholder="Enter Year (e.g., 2023)" required>
      </div>

      <div class="col-md-12 mb-3">
        <label class="form-label fw-bold">Activity for Competitive Exams</label>
        <textarea class="form-control" name="competitive_activity" rows="2" placeholder="Enter Activity Name"></textarea>
      </div>

      <div class="col-md-6 mb-3">
        <label class="form-label fw-bold">Number of Students (Competitive Exams)</label>
        <input type="number" class="form-control" name="competitive_students" placeholder="Enter Number of Students">
      </div>

      <div class="col-md-12 mb-3">
        <label class="form-label fw-bold">Activity for Career Counseling</label>
        <textarea class="form-control" name="career_counseling_activity" rows="2" placeholder="Enter Activity Name"></textarea>
      </div>

      <div class="col-md-6 mb-3">
        <label class="form-label fw-bold">Number of Students (Career Counseling)</label>
        <input type="number" class="form-control" name="counseling_students" placeholder="Enter Number of Students">
      </div>

      <div class="col-md-6 mb-3">
        <label class="form-label fw-bold">Number of Students Placed</label>
        <input type="number" class="form-control" name="placed_students" placeholder="Enter Number of Students Placed">
      </div>

      <div class="col-md-12 mb-3">
        <label class="form-label fw-bold">Link to Relevant Document</label>
        <input type="url" class="form-control" name="relevant_document" placeholder="Enter Document Link">
      </div>
    </div>
    <div class="form-footer">
      <button type="reset" class="btn btn-danger px-4" onclick="window.history.back();">Cancel</button>
      <button type="submit" class="btn btn-primary px-4">Submit</button>
    </div>
  </form>
  <hr class="my-4">

  <!-- Bulk Upload Section -->
  <h2 class="text-center my-4" style="color: #002d6b;">Bulk Upload Activities</h2>
  <form method="POST" enctype="multipart/form-data">
    {% csrf_token %}
    <div class="row">
      <div class="col-md-12 mb-3 text-center">
        <label class="form-label fw-bold">Upload Excel File</label>
        <input type="file" class="form-control" name="bulk_upload" accept=".xlsx, .xls" required>
      </div>
    </div>
    <div class="text-center">
      <!-- Link to download sample Excel file -->
      <a href="" class="btn btn-success px-4">Download Sample Excel</a>
      <button type="submit" class="btn btn-primary px-4">Upload</button>
    </div>
  </form>
  <br/><br/><br/>
</div>

{% endblock %}
