{% extends "base.html" %}
{% block content %}
<style>
    .section-title {
      font-size: 18px;
      font-weight: bold;
      margin-top: 20px;
      color: #002d6b;
    }
    .form-label {
      font-weight: bold;
    }
    .container {
      max-width: 1200px;
      margin: auto;
    }
  </style>

<div class="container">
    <div class="card-container">
        <div class="card-header">
            Add New Financial Support Record
        </div>
        <div class="card-body form-container">
            
            {% if messages %}
                {% for message in messages %}
                    <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
                        {{ message }}
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                    </div>
                {% endfor %}
            {% endif %}

            <form id="addFinancialSupportForm" method="POST" enctype="multipart/form-data">
                {% csrf_token %}
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-bold">Year</label>
                        <input type="number" class="form-control" name="year" placeholder="E.g., 2023" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-bold">Name of Teacher</label>
                        <input type="text" class="form-control" name="teacher_name" placeholder="E.g., Dr. John Doe" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-bold">PAN</label>
                        <input type="text" class="form-control" name="pan" placeholder="E.g., ABCDE1234F" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-bold">Conference/Workshop Name</label>
                        <input type="text" class="form-control" name="conference_name" placeholder="E.g., AI Workshop 2023" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-bold">Professional Body Name</label>
                        <input type="text" class="form-control" name="professional_body_name" placeholder="E.g., ACM" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-bold">Amount of Support</label>
                        <input type="number" class="form-control" name="amount" placeholder="E.g., 5000" required>
                    </div>
                </div>

                <div class="text-center">
                    <button type="reset" class="btn btn-danger px-4" onclick="window.history.back();">Cancel</button>
                    <button type="submit" class="btn btn-primary px-4">Submit</button>
                </div>
            </form>
        </div>
    </div>
     <!-- Bulk Upload Form -->
  <h2 class="text-center my-4" style="color: #002d6b;">Bulk Upload Financial Support Record</h2>
  <form method="POST" enctype="multipart/form-data">
    {% csrf_token %}
    <div class="row">
      <div class="col-md-12 mb-3 text-center">
        <label class="form-label fw-bold">Upload Excel File</label>
        <input type="file" class="form-control" name="bulk_upload" accept=".xlsx, .xls" required>
      </div>
    </div>
    <div class="text-center">
      <!-- Link to download sample Excel file -->
      <a href="" class="btn btn-success px-4">Download Sample Excel</a>
      <button type="submit" class="btn btn-primary px-4">Upload</button>
    </div>
  </form>
  <br/><br/><br/>
</div>
{% endblock %}
