{% extends "base.html" %}
{% block content %}
<style>
    .section-title {
      font-size: 18px;
      font-weight: bold;
      margin-top: 20px;
      color: #002d6b;
    }
    .form-label {
      font-weight: bold;
    }
    .container {
      max-width: 1200px;
      margin: auto;
    }
  </style>

<div class="container">
  <!-- Form Title -->
  <h2 class="text-center my-4" style="color: #002d6b;">Add New Course</h2>

  <!-- Main Form -->
  <form method="POST" enctype="multipart/form-data" action="{% url 'add_course' %}">
    {% csrf_token %}
    {% if messages %}
      {% for message in messages %}
        <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
          {{ message }}
          <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
      {% endfor %}
    {% endif %}
    <div class="row">
      <!-- Department Field -->
      <div class="col-md-6 mb-3">
        <label class="form-label fw-bold">Department</label>
        <select class="form-control" name="department" required>
          <option value="" disabled selected>Select Department</option>
          {% for department in departments %}
          <option value="{{ department.department_code }}">{{ department.department_name }}</option>
          {% endfor %}
        </select>
      </div>

      <!-- Year of Introduction -->
      <div class="col-md-6 mb-3">
        <label class="form-label fw-bold">Year of Introduction</label>
        <input type="number" class="form-control" name="year_of_introduction" placeholder="Enter Year" required>
      </div>

      <!-- Name of the Course -->
      <div class="col-md-6 mb-3">
        <label class="form-label fw-bold">Name of the Course</label>
        <input type="text" class="form-control" name="name" placeholder="Enter Course Name" required>
      </div>

      <!-- Course Code -->
      <div class="col-md-6 mb-3">
        <label class="form-label fw-bold">Course Code</label>
        <input type="text" class="form-control" name="code" placeholder="Enter Course Code" required>
      </div>

      <!-- Employability/Skill Development Activities -->
      <div class="col-md-12 mb-3">
        <label class="form-label fw-bold">Employability/Skill Development Activities</label>
        <textarea class="form-control" name="activities" rows="4" placeholder="Describe Activities or Content" required></textarea>
      </div>

      <!-- Document Upload -->
      <div class="col-md-12 mb-3">
        <label class="form-label fw-bold">Upload Document (Optional)</label>
        <input type="file" class="form-control" name="document">
      </div>
    </div>
    <div class="form-footer">
      <button type="reset" class="btn btn-danger px-4" onclick="window.history.back();">Cancel</button>
      <button type="submit" class="btn btn-primary px-4">Submit</button>
    </div>
  </form>

  <!-- Bulk Upload Section -->
  <hr class="my-4">
  <h2 class="text-center my-4" style="color: #002d6b;">Bulk Upload Courses</h2>
  <form method="POST" enctype="multipart/form-data">
    {% csrf_token %}
    <div class="row">
      <div class="col-md-12 mb-3 text-center">
        <label class="form-label fw-bold">Upload Excel File</label>
        <input type="file" class="form-control" name="bulk_upload" accept=".xlsx, .xls" required>
      </div>
    </div>
    <div class="text-center">
      <!-- Link to download sample Excel file -->
      <a href="" class="btn btn-success px-4">Download Sample Excel</a>
      <button type="submit" class="btn btn-primary px-4">Upload</button>
    </div>
  </form>
  <br/><br/><br/>
</div>

{% endblock %}
