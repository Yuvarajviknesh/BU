{% extends "base.html" %}
{% block content %}
<style>
  .card-container {
    max-width: 700px;
    margin: 50px auto;
    background: #ffffff;
    padding: 20px;
    border-radius: 10px;
    box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
  }
  .card-header {
    background-color: #002d6b;
    color: white;
    text-align: center;
    font-size: 20px;
    font-weight: bold;
    padding: 15px;
    border-top-left-radius: 10px;
    border-top-right-radius: 10px;
  }
  .form-footer {
    margin-top: 20px;
    display: flex;
    justify-content: center;
    gap: 10px;
  }
</style>

<div class="container">
  <div class="card-container">
    <div class="card-header">
      Add Demand Ratio
    </div>
    <div class="card-body">
      {% if error %}
        <div class="alert alert-danger">{{ error }}</div>
      {% endif %}

      <form method="POST">
        {% csrf_token %}

        <div class="row">
          <!-- Academic Year Dropdown -->
          <div class="col-md-6 mb-3">
            <label for="academicYear" class="form-label fw-bold">Academic Year</label>
            <select class="form-control" id="academicYear" name="academic_year" required>
              {% for year in academic_years %}
                <option value="{{ year }}">{{ year }}</option>
              {% endfor %}
            </select>
          </div>

          <!-- Programme Name -->
          <div class="col-md-6 mb-3">
            <label for="programmeName" class="form-label fw-bold">Programme Name</label>
            <input type="text" class="form-control" id="programmeName" name="programme_name" required>
          </div>

          <!-- Programme Code -->
          <div class="col-md-6 mb-3">
            <label for="programmeCode" class="form-label fw-bold">Programme Code</label>
            <input type="text" class="form-control" id="programmeCode" name="programme_code" required>
          </div>

          <!-- Number of Seats -->
          <div class="col-md-6 mb-3">
            <label for="numSeats" class="form-label fw-bold">Number of Seats Available</label>
            <input type="number" class="form-control" id="numSeats" name="num_seats" min="1" required>
          </div>

          <!-- Number of Applications -->
          <div class="col-md-6 mb-3">
            <label for="numApplications" class="form-label fw-bold">Number of Eligible Applications</label>
            <input type="number" class="form-control" id="numApplications" name="num_applications" min="0" required>
          </div>

          <!-- Number of Students Admitted -->
          <div class="col-md-6 mb-3">
            <label for="numAdmitted" class="form-label fw-bold">Number of Students Admitted</label>
            <input type="number" class="form-control" id="numAdmitted" name="num_students_admitted" min="0" required>
          </div>

          <!-- Department Dropdown (Restricted for non-superusers) -->
          <div class="col-md-12 mb-3">
            <label for="department" class="form-label fw-bold">Department</label>
            <select class="form-control" id="department" name="department" {% if not request.user.is_superuser %}readonly{% endif %} required>
              {% for department in departments %}
                <option value="{{ department.department_code }}">{{ department.department_name }}</option>
              {% endfor %}
            </select>
          </div>
        </div>

        <!-- Form Buttons -->
        <div class="form-footer">
          <button type="button" class="btn btn-danger px-4" onclick="window.history.back();">Cancel</button>
          <button type="submit" class="btn btn-primary px-4">Save</button>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
