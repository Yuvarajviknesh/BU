{% extends "base.html" %}
{% block content %}
<style>
    .card-container {
        max-width: 700px;
        margin: 50px auto;
        background: #ffffff;
        padding: 20px;
        border-radius: 10px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        margin-bottom: 100px;
    }
    .card-header {
        background-color: #002d6b;
        color: white;
        text-align: center;
        font-size: 20px;
        font-weight: bold;
        padding: 15px;
        border-top-left-radius: 10px;
        border-top-right-radius: 10px;
    }
    .form-container {
        padding: 20px;
    }
</style>

<div class="container">
    <div class="card-container">
        <div class="card-header">
            Add New E-Governance Record
        </div>
        <div class="card-body form-container">

            {% if messages %}
                {% for message in messages %}
                    <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
                        {{ message }}
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                    </div>
                {% endfor %}
            {% endif %}

            <form id="addEGovernanceForm" method="POST" enctype="multipart/form-data">
                {% csrf_token %}
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-bold">Area of E-Governance</label>
                        <select class="form-control" name="area" required>
                            <option value="">Select Area</option>
                            <option value="Administration">Administration</option>
                            <option value="Finance and Accounts">Finance and Accounts</option>
                            <option value="Student Admission and Support">Student Admission and Support</option>
                            <option value="Examination">Examination</option>
                        </select>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-bold">Year of Implementation</label>
                        <input type="number" class="form-control" name="year" placeholder="E.g., 2023" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-bold">Vendor Details</label>
                        <textarea class="form-control" name="vendorDetails" rows="2" placeholder="E.g., Vendor Name and Contact Info" required></textarea>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-bold">Relevant Resource Link</label>
                        <input type="url" class="form-control" name="resourceLink" placeholder="E.g., https://example.com">
                    </div>
                </div>
                <div class="row">
                    <div class="col-md-12 mb-3">
                        <label class="form-label fw-bold">Upload Document</label>
                        <input type="file" class="form-control" name="docFile" accept=".pdf,.doc,.docx">
                    </div>
                </div>

                <div class="text-center">
                    <button type="reset" class="btn btn-danger px-4" onclick="window.history.back();">Cancel</button>
                    <button type="submit" class="btn btn-primary px-4">Submit</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
