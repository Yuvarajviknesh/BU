{% extends "base.html" %}
{% block content %}
<style>
  .card-container {
    max-width: 700px;
    margin: 50px auto;
    background: #ffffff;
    padding: 20px;
    border-radius: 10px;
    box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
    margin-bottom: 100px;
  }
  .card-header {
    background-color: #002d6b;
    color: white;
    text-align: center;
    font-size: 20px;
    font-weight: bold;
    padding: 15px;
    border-top-left-radius: 10px;
    border-top-right-radius: 10px;
  }
  .form-container {
    padding: 20px;
  }
</style>

<div class="container">
  <div class="card-container">
    <div class="card-header">
      Add New E-Content Development
    </div>
    <div class="card-body form-container">
      
      {% if messages %}
        {% for message in messages %}
          <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
            {{ message }}
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
          </div>
        {% endfor %}
      {% endif %}

      <form id="addFacilityForm" method="POST" enctype="multipart/form-data">
        {% csrf_token %}
        <div class="row">
          <div class="col-md-6 mb-3">
            <label class="form-label fw-bold">Name of the Teacher</label>
            {% if user_role == "teacher" %}
              <input type="text" class="form-control" name="nameTeacher" value="{{ logged_in_teacher }}" readonly>
            {% else %}
              <select class="form-control" name="nameTeacher">
                {% for teacher in teachers %}
                  <option value="{{ teacher.id }}">{{ teacher.user_profile.user.username }} ({{teacher.position}}) </option>
                {% endfor %}
              </select>
            {% endif %}
          </div>
          <div class="col-md-6 mb-3">
            <label class="form-label fw-bold">Name of the Module Developed</label>
            <input type="text" class="form-control" name="moduleName" placeholder="E.g., Data Science Basics" required>
          </div>
          <div class="col-md-6 mb-3">
            <label class="form-label fw-bold">Platform</label>
            <input type="text" class="form-control" name="platform" placeholder="E.g., Moodle" required>
          </div>
          <div class="col-md-6 mb-3">
            <label class="form-label fw-bold">Launch Date</label>
            <input type="date" class="form-control" name="launchDate" required>
          </div>
          <div class="col-md-6 mb-3">
            <label class="form-label fw-bold">Upload Document</label>
            <input type="file" class="form-control" name="docFile" accept=".pdf,.doc,.docx">
          </div>
          <div class="col-md-6 mb-3">
            <label class="form-label fw-bold">Facilities Available</label>
            <input type="text" class="form-control" id="facilityList" name="facilityList" data-list="[]" placeholder="Comma-separated (e.g., Media Centre, Studio)">
          </div>
          <div class="col-md-6 mb-3">
            <label class="form-label fw-bold">Video Link</label>
            <input type="url" class="form-control" name="videoLink" placeholder="Enter URL">
          </div>
        </div>

        <div class="text-center">
          <button type="reset" class="btn btn-danger px-4" onclick="window.history.back();">Cancel</button>
          <button type="submit" class="btn btn-primary px-4">Submit</button>
        </div>
      </form>
    </div>
  </div>
</div>

{% endblock %}
