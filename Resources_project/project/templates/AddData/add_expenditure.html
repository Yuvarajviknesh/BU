{% extends "base.html" %}
{% block content %}
<style>
  .section-title {
    font-size: 18px;
    font-weight: bold;
    margin-top: 20px;
    color: #002d6b;
  }
  .form-label {
    font-weight: bold;
  }
  .container {
    max-width: 1200px;
    margin: auto;
  }
</style>

<div class="container">
  <!-- Form Title -->
  <h2 class="text-center my-4" style="color: #002d6b;">Add New Expenditure</h2>

  <!-- Main Form -->
  <form id="addDataForm" method="POST" action="{% url 'add_expenditure' %}" enctype="multipart/form-data">
    {% csrf_token %}
    <div class="row">
      <div class="col-md-6 mb-3">
        <label class="form-label fw-bold">Year</label>
        <input type="text" class="form-control" name="year" placeholder="Enter year" required>
      </div>
      <div class="col-md-6 mb-3">
        <label class="form-label fw-bold">Budget Allocated</label>
        <input type="number" class="form-control" name="budget" placeholder="Enter budget allocated" required>
      </div>
      <div class="col-md-6 mb-3">
        <label class="form-label fw-bold">Expenditure on Infrastructure</label>
        <input type="number" class="form-control" name="expenditure" placeholder="Enter expenditure on infrastructure" required>
      </div>
      <div class="col-md-6 mb-3">
        <label class="form-label fw-bold">Total Expenditure Excluding Salary</label>
        <input type="number" class="form-control" name="total_expenditure" placeholder="Enter total expenditure excluding salary" required>
      </div>
      <div class="col-md-6 mb-3">
        <label class="form-label fw-bold">Expenditure on Maintenance of Academic Facilities</label>
        <input type="number" class="form-control" name="academic_expenditure" placeholder="Enter expenditure on academic facilities" required>
      </div>
      <div class="col-md-6 mb-3">
        <label class="form-label fw-bold">Expenditure on Maintenance of Physical Facilities</label>
        <input type="number" class="form-control" name="physical_expenditure" placeholder="Enter expenditure on physical facilities" required>
      </div>
    </div>
    <div class="form-footer">
      <button type="reset" class="btn btn-danger px-4" onclick="window.history.back();">Cancel</button>
      <button type="submit" class="btn btn-primary px-4">Save</button>
    </div>
  </form>

  <!-- Bulk Upload Section -->
  <hr class="my-4">
  <h2 class="text-center my-4" style="color: #002d6b;">Bulk Upload Expenditures</h2>
  <form method="POST" enctype="multipart/form-data">
    {% csrf_token %}
    <div class="row">
      <div class="col-md-12 mb-3 text-center">
        <label class="form-label fw-bold">Upload Excel File</label>
        <input type="file" class="form-control" name="bulk_upload" accept=".xlsx, .xls" required>
      </div>
    </div>
    <div class="text-center">
      <!-- Link to download sample Excel file -->
      <a href="" class="btn btn-success px-4">Download Sample Excel</a>
      <button type="submit" class="btn btn-primary px-4">Upload</button>
    </div>
  </form>
  <br/><br/><br/>
</div>

{% endblock %}
