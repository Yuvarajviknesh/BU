{% extends "base.html" %}
{% block content %}
<style>
  .section-title {
    font-size: 18px;
    font-weight: bold;
    margin-top: 20px;
    color: #002d6b;
  }
  .form-label {
    font-weight: bold;
  }
  .container {
    max-width: 1200px;
    margin: auto;
  }
</style>

<div class="container">
  <!-- Form Title -->
  <h2 class="text-center my-4" style="color: #002d6b;">Add Field Project / Research Project / Internship Record</h2>

  <!-- Main Form -->
  <form method="POST" action="{% url 'add_student_project' %}" enctype="multipart/form-data">
    {% csrf_token %}
    {% if messages %}
      {% for message in messages %}
        <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
          {{ message }}
          <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
      {% endfor %}
    {% endif %}
    <div class="row">
      <!-- Programme Name -->
      <div class="col-md-12 mb-3">
        <label class="form-label fw-bold">Programme Name</label>
        <input type="text" class="form-control" name="programme_name" placeholder="Enter Programme Name" required>
      </div>

      <!-- Programme Code -->
      <div class="col-md-12 mb-3">
        <label class="form-label fw-bold">Programme Code</label>
        <input type="text" class="form-control" name="programme_code" placeholder="Enter Programme Code" required>
      </div>

      <!-- List of Students -->
      <div class="col-md-12 mb-3">
        <label class="form-label fw-bold">List of Students</label>
        <textarea class="form-control" name="students" placeholder="Enter the names of students (e.g., John Doe, Jane Smith)" rows="5" required></textarea>
      </div>

      <!-- Document Upload -->
      <div class="col-md-12 mb-3">
        <label class="form-label fw-bold">Upload Relevant Document</label>
        <input type="file" class="form-control" name="document" accept=".pdf,.jpg,.png,.jpeg" required>
      </div>
    </div>
    <div class="form-footer">
      <button type="reset" class="btn btn-danger px-4" onclick="window.history.back();">Cancel</button>
      <button type="submit" class="btn btn-primary px-4">Submit</button>
    </div>
  </form>

  <!-- Bulk Upload Section -->
  <hr class="my-4">
  <h2 class="text-center my-4" style="color: #002d6b;">Bulk Upload Records</h2>
  <form method="POST" enctype="multipart/form-data">
    {% csrf_token %}
    <div class="row">
      <div class="col-md-12 mb-3 text-center">
        <label class="form-label fw-bold">Upload Excel File</label>
        <input type="file" class="form-control" name="bulk_upload" accept=".xlsx, .xls" required>
      </div>
    </div>
    <div class="text-center">
      <!-- Link to download sample Excel file -->
      <a href="" class="btn btn-success px-4">Download Sample Excel</a>
      <button type="submit" class="btn btn-primary px-4">Upload</button>
    </div>
  </form>
  <br/><br/><br/>
</div>

{% endblock %}
