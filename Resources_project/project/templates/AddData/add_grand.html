{% extends "base.html" %}
{% block content %}
<style>
  .section-title {
    font-size: 18px;
    font-weight: bold;
    margin-top: 20px;
    color: #002d6b;
  }
  .form-label {
    font-weight: bold;
  }
  .container {
    max-width: 1200px;
    margin: auto;
  }
</style>

<div class="container">
  <!-- Form Title -->
  <h2 class="text-center my-4" style="color: #002d6b;">Add Grant Record</h2>

  <!-- Main Form -->
  <form method="POST" enctype="multipart/form-data">
    {% csrf_token %}
    {% if messages %}
      {% for message in messages %}
        <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
          {{ message }}
          <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
      {% endfor %}
    {% endif %}
    <div class="row">
      <div class="col-md-6 mb-3">
        <label class="form-label fw-bold">Year</label>
        <input type="text" class="form-control" name="year" placeholder="Enter Year" required>
      </div>
      <div class="col-md-6 mb-3">
        <label class="form-label fw-bold">Government Agency</label>
        <input type="text" class="form-control" name="gov_agency" placeholder="Enter Government Agency Name">
      </div>
      <div class="col-md-6 mb-3">
        <label class="form-label fw-bold">Non-Government Agency</label>
        <input type="text" class="form-control" name="non_gov_agency" placeholder="Enter Non-Government Agency Name">
      </div>
      <div class="col-md-6 mb-3">
        <label class="form-label fw-bold">Purpose</label>
        <input type="text" class="form-control" name="purpose" placeholder="Enter Purpose of Grant" required>
      </div>
      <div class="col-md-6 mb-3">
        <label class="form-label fw-bold">Amount (INR Lakhs)</label>
        <input type="number" class="form-control" name="amount" placeholder="Enter Amount" step="0.01" required>
      </div>
      <div class="col-md-12 mb-3">
        <label class="form-label fw-bold">Audited Statement Link</label>
        <input type="url" class="form-control" name="audited_statement_link" placeholder="Enter Link to Audited Statement">
      </div>
    </div>
    <div class="form-footer">
      <button type="reset" class="btn btn-danger px-4" onclick="window.history.back();">Cancel</button>
      <button type="submit" class="btn btn-primary px-4">Submit</button>
    </div>
  </form>

  <!-- Bulk Upload Section -->
  <hr class="my-4">
  <h2 class="text-center my-4" style="color: #002d6b;">Bulk Upload Grant Records</h2>
  <form method="POST" enctype="multipart/form-data">
    {% csrf_token %}
    <div class="row">
      <div class="col-md-12 mb-3 text-center">
        <label class="form-label fw-bold">Upload Excel File</label>
        <input type="file" class="form-control" name="bulk_upload" accept=".xlsx, .xls" required>
      </div>
    </div>
    <div class="text-center">
      <!-- Link to download sample Excel file -->
      <a href="" class="btn btn-success px-4">Download Sample Excel</a>
      <button type="submit" class="btn btn-primary px-4">Upload</button>
    </div>
  </form>
  <br/><br/><br/>
</div>

{% endblock %}
