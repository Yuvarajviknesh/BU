{% extends "base.html" %}
{% block content %}
<style>
  .card-container {
    max-width: 700px;
    margin: 50px auto;
    background: #ffffff;
    padding: 20px;
    border-radius: 10px;
    box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
    margin-bottom: 100px;
  }
  .card-header {
    background-color: #002d6b;
    color: white;
    text-align: center;
    font-size: 20px;
    font-weight: bold;
    padding: 15px;
    border-top-left-radius: 10px;
    border-top-right-radius: 10px;
  }
  .form-footer {
    margin-top: 20px;
    display: flex;
    justify-content: center;
    gap: 10px;
  }
</style>

<div class="container">
  <div class="card-container">
    <div class="card-header">
      Add Grant Record
    </div>
    <div class="card-body">
      <form method="POST">
        {% csrf_token %}
        <div class="row">
          <div class="col-md-6 mb-3">
            <label for="year" class="form-label fw-bold">Year</label>
            <input type="text" class="form-control" id="year" name="year" placeholder="Enter Year" required>
          </div>
          <div class="col-md-6 mb-3">
            <label for="govAgency" class="form-label fw-bold">Government Agency</label>
            <input type="text" class="form-control" id="govAgency" name="gov_agency" placeholder="Enter Government Agency Name">
          </div>
          <div class="col-md-6 mb-3">
            <label for="nonGovAgency" class="form-label fw-bold">Non-Government Agency</label>
            <input type="text" class="form-control" id="nonGovAgency" name="non_gov_agency" placeholder="Enter Non-Gov Agency Name">
          </div>
          <div class="col-md-6 mb-3">
            <label for="purpose" class="form-label fw-bold">Purpose</label>
            <input type="text" class="form-control" id="purpose" name="purpose" placeholder="Enter Purpose of Grant" required>
          </div>
          <div class="col-md-6 mb-3">
            <label for="amount" class="form-label fw-bold">Amount (INR Lakhs)</label>
            <input type="number" class="form-control" id="amount" name="amount" placeholder="Enter Amount" step="0.01" required>
          </div>
          <div class="col-md-12 mb-3">
            <label for="auditedStatementLink" class="form-label fw-bold">Audited Statement Link</label>
            <input type="url" class="form-control" id="auditedStatementLink" name="audited_statement_link" placeholder="Enter Link to Audited Statement">
          </div>
        </div>
        <div class="form-footer">
          <button type="button" class="btn btn-danger px-4" onclick="window.history.back();">Cancel</button>
          <button type="submit" class="btn btn-primary px-4">Save</button>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
