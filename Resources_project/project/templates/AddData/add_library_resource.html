{% extends "base.html" %}
{% block content %}
<style>
  .section-title {
    font-size: 18px;
    font-weight: bold;
    margin-top: 20px;
    color: #002d6b;
  }
  .form-label {
    font-weight: bold;
  }
  .container {
    max-width: 1200px;
    margin: auto;
  }
</style>

<div class="container">
  <!-- Form Title -->
  <h2 class="text-center my-4" style="color: #002d6b;">Add Library Resource</h2>

  <!-- Main Form -->
  <form method="POST" action="" enctype="multipart/form-data">
    {% csrf_token %}
    {% if messages %}
      {% for message in messages %}
        <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
          {{ message }}
          <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
      {% endfor %}
    {% endif %}
    <div class="row">
      <div class="col-md-6 mb-3">
        <label class="form-label fw-bold">Academic Year</label>
        <input type="text" class="form-control" name="academicYear" placeholder="Enter academic year (e.g., 2024-25)" required>
      </div>
      <div class="col-md-6 mb-3">
        <label class="form-label fw-bold">Library Resource</label>
        <select class="form-control" name="resourceName" required>
          <option value="" disabled selected>Select a resource type</option>
          <option value="Books">Books</option>
          <option value="Journals">Journals</option>
          <option value="e-Journals">e-Journals</option>
          <option value="e-Books">e-Books</option>
          <option value="e-ShodhSindhu">e-ShodhSindhu</option>
          <option value="Shodhganga">Shodhganga</option>
          <option value="Databases">Databases</option>
        </select>
      </div>
      <div class="col-md-6 mb-3">
        <label class="form-label fw-bold">Expenditure on e-Journals, e-Books</label>
        <input type="number" class="form-control" name="expenditureJournals" placeholder="Enter expenditure amount (in INR)" min="0" required>
      </div>
      <div class="col-md-6 mb-3">
        <label class="form-label fw-bold">Expenditure on Other e-Resources</label>
        <input type="number" class="form-control" name="expenditureOthers" placeholder="Enter expenditure on other e-resources (in INR)" min="0" required>
      </div>
      <div class="col-md-6 mb-3">
        <label class="form-label fw-bold">Total Library Expenditure</label>
        <input type="number" class="form-control" name="totalExpenditure" placeholder="Enter total library expenditure (in INR)" min="0" required>
      </div>
      <div class="col-md-6 mb-3">
        <label class="form-label fw-bold">Upload Supporting Document</label>
        <input type="file" class="form-control" name="document" accept=".pdf,.jpg,.png,.jpeg" required>
      </div>
    </div>
    <div class="form-footer">
      <button type="reset" class="btn btn-danger px-4" onclick="window.history.back();">Cancel</button>
      <button type="submit" class="btn btn-primary px-4">Submit</button>
    </div>
  </form>

  <!-- Bulk Upload Section -->
  <hr class="my-4">
  <h2 class="text-center my-4" style="color: #002d6b;">Bulk Upload Library Resources</h2>
  <form method="POST" enctype="multipart/form-data">
    {% csrf_token %}
    <div class="row">
      <div class="col-md-12 mb-3 text-center">
        <label class="form-label fw-bold">Upload Excel File</label>
        <input type="file" class="form-control" name="bulk_upload" accept=".xlsx, .xls" required>
      </div>
    </div>
    <div class="text-center">
      <!-- Link to download sample Excel file -->
      <a href="" class="btn btn-success px-4">Download Sample Excel</a>
      <button type="submit" class="btn btn-primary px-4">Upload</button>
    </div>
  </form>
  <br/><br/><br/>
</div>

{% endblock %}
