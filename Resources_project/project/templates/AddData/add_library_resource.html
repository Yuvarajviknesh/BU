{% extends "base.html" %}
{% block content %}
<style>
  .card-container {
    max-width: 700px;
    margin: 50px auto;
    background: #ffffff;
    padding: 20px;
    border-radius: 10px;
    box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
    margin-bottom: 100px;
  }
  .card-header {
    background-color: #002d6b;
    color: white;
    text-align: center;
    font-size: 20px;
    font-weight: bold;
    padding: 15px;
    border-top-left-radius: 10px;
    border-top-right-radius: 10px;
  }
  .form-container {
    padding: 20px;
  }
  .form-footer {
    margin-top: 20px;
    display: flex;
    justify-content: center;
    gap: 10px;
  }
</style>
  <div class="container">
    <div class="card-container">
      <div class="card-header">
        Add Library Resource
      </div>
      <div class="card-body form-container">
        <form method="post" action="" enctype="multipart/form-data">
          {% csrf_token %}
          <div class="row">
            <div class="col-md-6 mb-3">
              <label for="academicYear" class="form-label fw-bold">Academic Year</label>
              <input type="text" class="form-control" id="academicYear" name="academicYear" placeholder="Enter academic year (e.g., 2024-25)" required>
            </div>
            <div class="col-md-6 mb-3">
              <label for="resourceName" class="form-label fw-bold">Library Resource</label>
              <select class="form-control" id="resourceName" name="resourceName" required>
                <option value="" disabled selected>Select a resource type</option>
                <option value="Books">Books</option>
                <option value="Journals">Journals</option>
                <option value="e-Journals">e-Journals</option>
                <option value="e-Books">e-Books</option>
                <option value="e-ShodhSindhu">e-ShodhSindhu</option>
                <option value="Shodhganga">Shodhganga</option>
                <option value="Databases">Databases</option>
              </select>
            </div>
            <div class="col-md-6 mb-3">
              <label for="expenditureJournals" class="form-label fw-bold">Expenditure on e-Journals, e-Books</label>
              <input type="number" class="form-control" id="expenditureJournals" name="expenditureJournals" placeholder="Enter expenditure amount (in INR)" min="0" required>
            </div>
            <div class="col-md-6 mb-3">
              <label for="expenditureOthers" class="form-label fw-bold">Expenditure on Other e-Resources</label>
              <input type="number" class="form-control" id="expenditureOthers" name="expenditureOthers" placeholder="Enter expenditure on other e-resources (in INR)" min="0" required>
            </div>
            <div class="col-md-6 mb-3">
              <label for="totalExpenditure" class="form-label fw-bold">Total Library Expenditure</label>
              <input type="number" class="form-control" id="totalExpenditure" name="totalExpenditure" placeholder="Enter total library expenditure (in INR)" min="0" required>
            </div>
            <div class="col-md-6 mb-3">
              <label for="document" class="form-label fw-bold">Upload Supporting Document</label>
              <input type="file" class="form-control" id="document" name="document" accept=".pdf,.jpg,.png,.jpeg" required>
            </div>
          </div>
          <div class="form-footer">
            <button type="button" class="btn btn-danger px-4" onclick="window.history.back();">Cancel</button>
            <button type="submit" class="btn btn-primary px-4">Save</button>
          </div>
        </form>
      </div>
    </div>
  </div>
{% endblock %}
