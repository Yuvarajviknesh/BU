{% extends "base.html" %}
{% block content %}
<style>
  .card-container {
    max-width: 700px;
    margin: 50px auto;
    background: #ffffff;
    padding: 20px;
    border-radius: 10px;
    box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
    margin-bottom: 100px;
  }
  .card-header {
    background-color: #002d6b;
    color: white;
    text-align: center;
    font-size: 20px;
    font-weight: bold;
    padding: 15px;
    border-top-left-radius: 10px;
    border-top-right-radius: 10px;
  }
  .form-footer {
    margin-top: 20px;
    display: flex;
    justify-content: center;
    gap: 10px;
  }
</style>

<div class="container">
  <div class="card-container">
    <div class="card-header">
      Add Patent
    </div>
    <div class="card-body">
      <form method="POST" action="" enctype="multipart/form-data">
        {% csrf_token %}
        <div class="row">
          <div class="col-md-6 mb-3">
            <label for="patenterName" class="form-label fw-bold">Name of the Patenter</label>
            <input type="text" class="form-control" id="patenterName" name="patenter_name" placeholder="Enter Patenter's Name" required>
          </div>

          <div class="col-md-6 mb-3">
            <label for="patentNumber" class="form-label fw-bold">Patent Number</label>
            <input type="text" class="form-control" id="patentNumber" name="patent_number" placeholder="Enter Patent Number" required>
          </div>

          <div class="col-md-6 mb-3">
            <label for="patentTitle" class="form-label fw-bold">Title of the Patent</label>
            <input type="text" class="form-control" id="patentTitle" name="patent_title" placeholder="Enter Patent Title" required>
          </div>

          <div class="col-md-6 mb-3">
            <label for="awardYear" class="form-label fw-bold">Year of Award</label>
            <input type="number" class="form-control" id="awardYear" name="award_year" placeholder="Enter Year (e.g., 2024)" min="1900" max="2100" required>
          </div>

          <div class="col-md-12 mb-3">
            <label for="document" class="form-label fw-bold">Upload Supporting Document</label>
            <input type="file" class="form-control" id="document" name="document" accept=".pdf,.jpg,.png,.jpeg" required>
          </div>
        </div>

        <div class="form-footer">
          <button type="button" class="btn btn-danger px-4" onclick="window.history.back();">Cancel</button>
          <button type="submit" class="btn btn-primary px-4">Save</button>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
