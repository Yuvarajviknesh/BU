{% extends "base.html" %}
{% block content %}
<style>
  .card-container {
    max-width: 700px;
    margin: 50px auto;
    background: #ffffff;
    padding: 20px;
    border-radius: 10px;
    box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
    margin-bottom: 100px;
  }
  .card-header {
    background-color: #002d6b;
    color: white;
    text-align: center;
    font-size: 20px;
    font-weight: bold;
    padding: 15px;
    border-top-left-radius: 10px;
    border-top-right-radius: 10px;
  }
  .form-container {
    padding: 20px;
  }
  .form-footer {
    margin-top: 20px;
    display: flex;
    justify-content: center;
    gap: 15px; /* Added spacing between buttons */
  }
  .btn {
    padding: 10px 20px;
    font-size: 16px;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    text-transform: uppercase;
  }
  .btn-primary {
    background-color: #007bff;
    color: white;
  }
  .btn-primary:hover {
    background-color: #0056b3;
  }
  .btn-danger {
    background-color: #dc3545;
    color: white;
  }
  .btn-danger:hover {
    background-color: #a71d2a;
  }
</style>

<div class="container">
  <div class="card-container">
    <div class="card-header">
      Add Programme
    </div>
    <div class="card-body form-container">
      <form method="POST" action="{% url 'add_program_list' %}" enctype="multipart/form-data">
        {% csrf_token %}
        <div class="row">
          <!-- Programme Code -->
          <div class="col-md-6 mb-3">
            <label for="programmeCode" class="form-label fw-bold">Programme Code</label>
            <input type="text" class="form-control" id="programmeCode" name="programme_code" placeholder="Enter Programme Code" required>
          </div>

          <!-- Programme Name -->
          <div class="col-md-6 mb-3">
            <label for="programmeName" class="form-label fw-bold">Programme Name</label>
            <input type="text" class="form-control" id="programmeName" name="programme_name" placeholder="Enter Programme Name" required>
          </div>

          <!-- Year of Introduction -->
          <div class="col-md-6 mb-3">
            <label for="yearOfIntroduction" class="form-label fw-bold">Year of Introduction</label>
            <input type="number" class="form-control" id="yearOfIntroduction" name="year_of_introduction" placeholder="Enter Year" min="1900" max="2100" required>
          </div>

          <!-- CBCS Status -->
          <div class="col-md-6 mb-3">
            <label for="cbcsStatus" class="form-label fw-bold">CBCS Status</label>
            <select class="form-control" id="cbcsStatus" name="cbcs_status" required>
              <option value="" disabled selected>Select CBCS Status</option>
              <option value="Yes">CBCS Implemented</option>
              <option value="No">CBCS Not Implemented</option>
            </select>
          </div>

          <!-- Year of CBCS Implementation -->
          <div class="col-md-6 mb-3">
            <label for="yearOfCBCSImplementation" class="form-label fw-bold">Year of CBCS Implementation</label>
            <input type="number" class="form-control" id="yearOfCBCSImplementation" name="year_of_cbcs_implementation" placeholder="Enter Year of CBCS Implementation (if any)">
          </div>

          <!-- Year of Revision -->
          <div class="col-md-6 mb-3">
            <label for="yearOfRevision" class="form-label fw-bold">Year of Revision</label>
            <input type="number" class="form-control" id="yearOfRevision" name="year_of_revision" placeholder="Enter Year of Revision (if any)">
          </div>

          <!-- Content Update (%) -->
          <div class="col-md-6 mb-3">
            <label for="contentUpdatePercentage" class="form-label fw-bold">Content Update (%)</label>
            <input type="number" class="form-control" id="contentUpdatePercentage" name="content_update_percentage" placeholder="Enter Content Update Percentage">
          </div>

          <!-- Document Link -->
          <div class="col-md-6 mb-3">
            <label for="documentLink" class="form-label fw-bold">Document Link</label>
            <input type="url" class="form-control" id="documentLink" name="document_link" placeholder="Enter Document Link" required>
          </div>
        </div>

        <!-- Buttons -->
        <div class="form-footer">
          <button type="button" class="btn btn-danger px-4" onclick="window.history.back();">Cancel</button>
          <button type="submit" class="btn btn-primary px-4">Submit</button>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
