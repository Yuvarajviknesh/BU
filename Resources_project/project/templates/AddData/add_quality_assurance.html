{% extends "base.html" %}
{% block content %}
<style>
  .card-container {
    max-width: 700px;
    margin: 50px auto;
    background: #ffffff;
    padding: 20px;
    border-radius: 10px;
    box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
    margin-bottom: 100px;
  }
  .card-header {
    background-color: #002d6b;
    color: white;
    text-align: center;
    font-size: 20px;
    font-weight: bold;
    padding: 15px;
    border-top-left-radius: 10px;
    border-top-right-radius: 10px;
  }
  .form-footer {
    margin-top: 20px;
    display: flex;
    justify-content: center;
    gap: 10px;
  }
</style>

<div class="container">
  <div class="card-container">
    <div class="card-header">
      Add Quality Assurance Initiative
    </div>
    <div class="card-body">
      <form method="POST">
        {% csrf_token %}
        <div class="row">
          <div class="col-md-6 mb-3">
            <label for="year" class="form-label fw-bold">Year</label>
            <input type="text" class="form-control" id="year" name="year" placeholder="Enter Year (e.g., 2023)" required>
          </div>
          <div class="col-md-12 mb-3">
            <label for="conferences" class="form-label fw-bold">Conferences, Seminars, Workshops</label>
            <textarea class="form-control" id="conferences" name="conferences" rows="2" placeholder="Enter details"></textarea>
          </div>
          <div class="col-md-12 mb-3">
            <label for="audit" class="form-label fw-bold">Academic Administrative Audit</label>
            <textarea class="form-control" id="audit" name="academic_audit" rows="2" placeholder="Enter details"></textarea>
          </div>
          <div class="col-md-12 mb-3">
            <label for="nirf" class="form-label fw-bold">NIRF Participation</label>
            <input type="text" class="form-control" id="nirf" name="nirf_status" placeholder="Enter NIRF status">
          </div>
          <div class="col-md-12 mb-3">
            <label for="iso" class="form-label fw-bold">ISO Certification</label>
            <input type="text" class="form-control" id="iso" name="iso_certification" placeholder="Enter ISO certification details">
          </div>
          <div class="col-md-12 mb-3">
            <label for="nba" class="form-label fw-bold">NBA/Other Certifications</label>
            <input type="text" class="form-control" id="nba" name="nba_certification" placeholder="Enter NBA or other certifications">
          </div>
          <div class="col-md-12 mb-3">
            <label for="collaborative" class="form-label fw-bold">Collaborative Quality Initiatives</label>
            <textarea class="form-control" id="collaborative" name="collaborative_initiatives" rows="2" placeholder="Enter details"></textarea>
          </div>
          <div class="col-md-12 mb-3">
            <label for="orientation" class="form-label fw-bold">Orientation Programme</label>
            <textarea class="form-control" id="orientation" name="orientation_programme" rows="2" placeholder="Enter details"></textarea>
          </div>
        </div>
        <div class="form-footer">
          <button type="button" class="btn btn-danger px-4" onclick="window.history.back();">Cancel</button>
          <button type="submit" class="btn btn-primary px-4">Save</button>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
