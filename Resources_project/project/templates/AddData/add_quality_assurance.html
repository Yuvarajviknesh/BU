{% extends "base.html" %}
{% block content %}
<style>
  .section-title {
    font-size: 18px;
    font-weight: bold;
    margin-top: 20px;
    color: #002d6b;
  }
  .form-label {
    font-weight: bold;
  }
  .container {
    max-width: 1200px;
    margin: auto;
  }
</style>

<div class="container">
  <!-- Form Title -->
  <h2 class="text-center my-4" style="color: #002d6b;">Add Quality Assurance Initiative</h2>

  <!-- Main Form -->
  <form method="POST" action="" enctype="multipart/form-data">
    {% csrf_token %}
    {% if messages %}
      {% for message in messages %}
        <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
          {{ message }}
          <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
      {% endfor %}
    {% endif %}
    <div class="row">
      <!-- Year -->
      <div class="col-md-6 mb-3">
        <label class="form-label fw-bold">Year</label>
        <input type="text" class="form-control" name="year" placeholder="Enter Year (e.g., 2023)" required>
      </div>
      <!-- Conferences, Seminars, Workshops -->
      <div class="col-md-12 mb-3">
        <label class="form-label fw-bold">Conferences, Seminars, Workshops</label>
        <textarea class="form-control" name="conferences" rows="2" placeholder="Enter details"></textarea>
      </div>
      <!-- Academic Administrative Audit -->
      <div class="col-md-12 mb-3">
        <label class="form-label fw-bold">Academic Administrative Audit</label>
        <textarea class="form-control" name="academic_audit" rows="2" placeholder="Enter details"></textarea>
      </div>
      <!-- NIRF Participation -->
      <div class="col-md-12 mb-3">
        <label class="form-label fw-bold">NIRF Participation</label>
        <input type="text" class="form-control" name="nirf_status" placeholder="Enter NIRF status">
      </div>
      <!-- ISO Certification -->
      <div class="col-md-12 mb-3">
        <label class="form-label fw-bold">ISO Certification</label>
        <input type="text" class="form-control" name="iso_certification" placeholder="Enter ISO certification details">
      </div>
      <!-- NBA/Other Certifications -->
      <div class="col-md-12 mb-3">
        <label class="form-label fw-bold">NBA/Other Certifications</label>
        <input type="text" class="form-control" name="nba_certification" placeholder="Enter NBA or other certifications">
      </div>
      <!-- Collaborative Initiatives -->
      <div class="col-md-12 mb-3">
        <label class="form-label fw-bold">Collaborative Quality Initiatives</label>
        <textarea class="form-control" name="collaborative_initiatives" rows="2" placeholder="Enter details"></textarea>
      </div>
      <!-- Orientation Programme -->
      <div class="col-md-12 mb-3">
        <label class="form-label fw-bold">Orientation Programme</label>
        <textarea class="form-control" name="orientation_programme" rows="2" placeholder="Enter details"></textarea>
      </div>
    </div>
    <div class="form-footer">
      <button type="reset" class="btn btn-danger px-4" onclick="window.history.back();">Cancel</button>
      <button type="submit" class="btn btn-primary px-4">Submit</button>
    </div>
  </form>

  <!-- Bulk Upload Section -->
  <hr class="my-4">
  <h2 class="text-center my-4" style="color: #002d6b;">Bulk Upload Quality Assurance Initiatives</h2>
  <form method="POST" enctype="multipart/form-data">
    {% csrf_token %}
    <div class="row">
      <div class="col-md-12 mb-3 text-center">
        <label class="form-label fw-bold">Upload Excel File</label>
        <input type="file" class="form-control" name="bulk_upload" accept=".xlsx, .xls" required>
      </div>
    </div>
    <div class="text-center">
      <!-- Link to download sample Excel file -->
      <a href="" class="btn btn-success px-4">Download Sample Excel</a>
      <button type="submit" class="btn btn-primary px-4">Upload</button>
    </div>
  </form>
  <br/><br/><br/>
</div>

{% endblock %}
