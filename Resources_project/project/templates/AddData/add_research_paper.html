{% extends "base.html" %}
{% block content %}
<style>
  .section-title {
    font-size: 18px;
    font-weight: bold;
    margin-top: 20px;
    color: #002d6b;
  }
  .form-label {
    font-weight: bold;
  }
  .container {
    max-width: 1200px;
    margin: auto;
  }
</style>

<div class="container">
  <!-- Form Title -->
  <h2 class="text-center my-4" style="color: #002d6b;">Add Research Paper</h2>

  <!-- Main Form -->
  <form method="POST" action="" enctype="multipart/form-data">
    {% csrf_token %}
    {% if messages %}
      {% for message in messages %}
        <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
          {{ message }}
          <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
      {% endfor %}
    {% endif %}
    <div class="row">
      <div class="col-md-6 mb-3">
        <label class="form-label fw-bold">Title of the Paper</label>
        <input type="text" class="form-control" name="paper_title" placeholder="Enter Paper Title" required>
      </div>

      <div class="col-md-6 mb-3">
        <label class="form-label fw-bold">Name of the Author(s)</label>
        <input type="text" class="form-control" name="author_name" placeholder="Enter Author Name(s)" required>
      </div>

      <div class="col-md-6 mb-3">
        <label class="form-label fw-bold">Department of the Teacher</label>
        <input type="text" class="form-control" name="department" value="{{ user.userprofile.department.department_name }}" readonly>
      </div>

      <div class="col-md-6 mb-3">
        <label class="form-label fw-bold">Name of the Journal</label>
        <input type="text" class="form-control" name="journal_name" placeholder="Enter Journal Name" required>
      </div>

      <div class="col-md-6 mb-3">
        <label class="form-label fw-bold">Year of Publication</label>
        <input type="number" class="form-control" name="publication_year" placeholder="Enter Year (e.g., 2024)" min="1900" max="2100" required>
      </div>

      <div class="col-md-6 mb-3">
        <label class="form-label fw-bold">ISSN Number</label>
        <input type="text" class="form-control" name="issn_number" placeholder="Enter ISSN Number" required>
      </div>

      <div class="col-md-6 mb-3">
        <label class="form-label fw-bold">UGC Enlistment Link</label>
        <input type="url" class="form-control" name="ugc_link" placeholder="Enter UGC Enlistment Link" required>
      </div>

      <div class="col-md-6 mb-3">
        <label class="form-label fw-bold">Upload Supporting Document</label>
        <input type="file" class="form-control" name="document" accept=".pdf,.jpg,.png,.jpeg" required>
      </div>
    </div>

    <div class="form-footer">
      <button type="reset" class="btn btn-danger px-4" onclick="window.history.back();">Cancel</button>
      <button type="submit" class="btn btn-primary px-4">Submit</button>
    </div>
  </form>

  <!-- Bulk Upload Section -->
  <hr class="my-4">
  <h2 class="text-center my-4" style="color: #002d6b;">Bulk Upload Research Papers</h2>
  <form method="POST" enctype="multipart/form-data">
    {% csrf_token %}
    <div class="row">
      <div class="col-md-12 mb-3 text-center">
        <label class="form-label fw-bold">Upload Excel File</label>
        <input type="file" class="form-control" name="bulk_upload" accept=".xlsx, .xls" required>
      </div>
    </div>
    <div class="text-center">
      <!-- Link to download sample Excel file -->
      <a href="" class="btn btn-success px-4">Download Sample Excel</a>
      <button type="submit" class="btn btn-primary px-4">Upload</button>
    </div>
  </form>
  <br/><br/><br/>
</div>

{% endblock %}
