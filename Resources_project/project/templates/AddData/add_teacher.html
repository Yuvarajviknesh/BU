{% extends "base.html" %}
{% block content %}
<style>
    .card-container {
        max-width: 700px;
        margin: 50px auto;
        background: #ffffff;
        padding: 20px;
        border-radius: 10px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        margin-bottom: 100px;
    }
    .card-header {
        background-color: #002d6b;
        color: white;
        text-align: center;
        font-size: 20px;
        font-weight: bold;
        padding: 15px;
        border-top-left-radius: 10px;
        border-top-right-radius: 10px;
    }
    .form-container {
        padding: 20px;
    }
    .form-footer {
        margin-top: 20px;
        display: flex;
        justify-content: center;
        gap: 10px;
    }
</style>

<div class="container">
    <div class="card-container">
        <div class="card-header">
            Add Teacher Record
        </div>
        <div class="card-body form-container">
            <form method="POST" action="{% url 'add_teacher' %}">
                {% csrf_token %}
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-bold">Name of full time teacher with Ph.D./D.M/M.Ch./D.N.B Superspeciality/D.Sc./D’Lit.</label>
                        <input type="text" class="form-control" name="teacher_name" placeholder="Enter Teacher Name" required>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-bold">Qualification (Ph.D./D.M/M.Ch./D.N.B Superspeciality/D.Sc./D’Lit.) and Year of obtaining</label>
                        <input type="text" class="form-control" name="qualification" placeholder="Enter Qualification and Year" required>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-bold">Whether recognised as research Guide for Ph.D./D.M/M.Ch./D.N.B Superspeciality/D.Sc./D’Lit.</label>
                        <select class="form-control" name="is_research_guide" required>
                            <option value="">Select Status</option>
                            <option value="Yes">Yes</option>
                            <option value="No">No</option>
                        </select>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-bold">Year of Recognition as Research Guide</label>
                        <input type="number" class="form-control" name="recognition_year" placeholder="Enter Year of Recognition" min="1900" max="2100" required>
                    </div>
                </div>

                <div class="form-footer">
                    <button type="button" class="btn btn-danger px-4" onclick="window.history.back();">Cancel</button>
                    <button type="submit" class="btn btn-primary px-4">Save</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
