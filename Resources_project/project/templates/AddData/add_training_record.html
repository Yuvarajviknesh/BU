{% extends "base.html" %}
{% block content %}
<style>
    .card-container {
        max-width: 700px;
        margin: 50px auto;
        background: #ffffff;
        padding: 20px;
        border-radius: 10px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        margin-bottom: 100px;
    }
    .card-header {
        background-color: #002d6b;
        color: white;
        text-align: center;
        font-size: 20px;
        font-weight: bold;
        padding: 15px;
        border-top-left-radius: 10px;
        border-top-right-radius: 10px;
    }
    .form-container {
        padding: 20px;
    }
</style>

<div class="container">
    <div class="card-container">
        <div class="card-header">
            Add New Training Record
        </div>
        <div class="card-body form-container">
            
            {% if messages %}
                {% for message in messages %}
                    <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
                        {{ message }}
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                    </div>
                {% endfor %}
            {% endif %}

            <form id="addTrainingRecordForm" method="POST" enctype="multipart/form-data">
                {% csrf_token %}
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-bold">Dates (from-to) (DD-MM-YYYY)</label>
                        <input type="text" class="form-control" name="dates" placeholder="E.g., 01-01-2023 to 05-01-2023" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-bold">Title of the Professional Development Program for Teaching Staff</label>
                        <input type="text" class="form-control" name="titleTeaching" placeholder="E.g., Advanced Teaching Methods" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-bold">Title of the Administrative Training Program for Non-Teaching Staff</label>
                        <input type="text" class="form-control" name="titleNonTeaching" placeholder="E.g., Office Management Skills" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-bold">No. of Participants</label>
                        <input type="number" class="form-control" name="participants" placeholder="E.g., 25" required>
                    </div>
                </div>

                <div class="text-center">
                    <button type="reset" class="btn btn-danger px-4" onclick="window.history.back();">Cancel</button>
                    <button type="submit" class="btn btn-primary px-4">Submit</button>
                </div>
            </form>
        </div>
    </div>
</div>

{% endblock %}
