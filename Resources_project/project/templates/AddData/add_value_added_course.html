{% extends "base.html" %}
{% block content %}
<style>
  .section-title {
    font-size: 18px;
    font-weight: bold;
    margin-top: 20px;
    color: #002d6b;
  }
  .form-label {
    font-weight: bold;
  }
  .container {
    max-width: 1200px;
    margin: auto;
  }
</style>

<div class="container">
  <!-- Form Title -->
  <h2 class="text-center my-4" style="color: #002d6b;">Add Value-Added Course</h2>

  <!-- Main Form -->
  <form method="POST" action="{% url 'add_value_added_course' %}" enctype="multipart/form-data">
    {% csrf_token %}
    {% if messages %}
      {% for message in messages %}
        <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
          {{ message }}
          <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
      {% endfor %}
    {% endif %}
    <div class="row">
      <!-- Department Selection -->
      <div class="col-md-6 mb-3">
        <label class="form-label fw-bold">Department</label>
        <select class="form-control" name="department" required>
          <option value="" disabled selected>Select Department</option>
          {% for dept in departments %}
            <option value="{{ dept.department_code }}">{{ dept.department_name }}</option>
          {% endfor %}
        </select>
      </div>

      <!-- Course Name -->
      <div class="col-md-6 mb-3">
        <label class="form-label fw-bold">Course Name</label>
        <input type="text" class="form-control" name="name" placeholder="Enter Course Name" required>
      </div>

      <!-- Course Code -->
      <div class="col-md-6 mb-3">
        <label class="form-label fw-bold">Course Code</label>
        <input type="text" class="form-control" name="code" placeholder="Enter Course Code" required>
      </div>

      <!-- Year of Offering -->
      <div class="col-md-6 mb-3">
        <label class="form-label fw-bold">Year of Offering</label>
        <input type="number" class="form-control" name="year_of_offering" placeholder="Enter Year (e.g., 2024)" min="1900" max="2100" required>
      </div>

      <!-- Number of Times Offered -->
      <div class="col-md-6 mb-3">
        <label class="form-label fw-bold">Number of Times Offered</label>
        <input type="number" class="form-control" name="times_offered" placeholder="Enter Number of Times Offered" required>
      </div>

      <!-- Duration -->
      <div class="col-md-6 mb-3">
        <label class="form-label fw-bold">Duration</label>
        <input type="text" class="form-control" name="duration" placeholder="Enter Duration (e.g., 30 Hours)" required>
      </div>

      <!-- Students Enrolled -->
      <div class="col-md-6 mb-3">
        <label class="form-label fw-bold">Students Enrolled</label>
        <input type="number" class="form-control" name="students_enrolled" placeholder="Enter Students Enrolled" required>
      </div>

      <!-- Students Completed -->
      <div class="col-md-6 mb-3">
        <label class="form-label fw-bold">Students Completed</label>
        <input type="number" class="form-control" name="students_completed" placeholder="Enter Students Completed" required>
      </div>

      <!-- Supporting Document -->
      <div class="col-md-12 mb-3">
        <label class="form-label fw-bold">Upload Supporting Document</label>
        <input type="file" class="form-control" name="document" accept=".pdf,.jpg,.png,.jpeg">
      </div>
    </div>
    <div class="form-footer">
      <button type="reset" class="btn btn-danger px-4" onclick="window.history.back();">Cancel</button>
      <button type="submit" class="btn btn-primary px-4">Submit</button>
    </div>
  </form>

  <!-- Bulk Upload Section -->
  <hr class="my-4">
  <h2 class="text-center my-4" style="color: #002d6b;">Bulk Upload Value-Added Courses</h2>
  <form method="POST" enctype="multipart/form-data">
    {% csrf_token %}
    <div class="row">
      <div class="col-md-12 mb-3 text-center">
        <label class="form-label fw-bold">Upload Excel File</label>
        <input type="file" class="form-control" name="bulk_upload" accept=".xlsx, .xls" required>
      </div>
    </div>
    <div class="text-center">
      <!-- Link to download sample Excel file -->
      <a href="" class="btn btn-success px-4">Download Sample Excel</a>
      <button type="submit" class="btn btn-primary px-4">Upload</button>
    </div>
  </form>
  <br/><br/><br/>
</div>

{% endblock %}
