{% extends "base.html" %}
{% block content %}
<style>
  .card-container {
    max-width: 700px;
    margin: 50px auto;
    background: #ffffff;
    padding: 20px;
    border-radius: 10px;
    box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
    margin-bottom: 100px;
  }
  .card-header {
    background-color: #002d6b;
    color: white;
    text-align: center;
    font-size: 20px;
    font-weight: bold;
    padding: 15px;
    border-top-left-radius: 10px;
    border-top-right-radius: 10px;
  }
  .form-footer {
    margin-top: 20px;
    display: flex;
    justify-content: center;
    gap: 10px;
  }
</style>

<div class="container">
  <div class="card-container">
    <div class="card-header">
      Add Value-Added Course
    </div>
    <div class="card-body">
      <form method="POST" action="{% url 'add_value_added_course' %}" enctype="multipart/form-data">
        {% csrf_token %}
        <div class="row">
          <!-- Department Selection -->
          <div class="col-md-6 mb-3">
            <label for="department" class="form-label fw-bold">Department</label>
            <select class="form-control" id="department" name="department" required>
              <option value="" disabled selected>Select Department</option>
              {% for dept in departments %}
              <option value="{{ dept.department_code }}">{{ dept.department_name }}</option>
              {% endfor %}
            </select>
          </div>

          <!-- Course Name -->
          <div class="col-md-6 mb-3">
            <label for="courseName" class="form-label fw-bold">Course Name</label>
            <input type="text" class="form-control" id="courseName" name="name" placeholder="Enter Course Name" required>
          </div>

          <!-- Course Code -->
          <div class="col-md-6 mb-3">
            <label for="courseCode" class="form-label fw-bold">Course Code</label>
            <input type="text" class="form-control" id="courseCode" name="code" placeholder="Enter Course Code" required>
          </div>

          <!-- Year of Offering -->
          <div class="col-md-6 mb-3">
            <label for="yearOffering" class="form-label fw-bold">Year of Offering</label>
            <input type="number" class="form-control" id="yearOffering" name="year_of_offering" placeholder="Enter Year (e.g., 2024)" min="1900" max="2100" required>
          </div>

          <!-- Number of Times Offered -->
          <div class="col-md-6 mb-3">
            <label for="timesOffered" class="form-label fw-bold">Number of Times Offered</label>
            <input type="number" class="form-control" id="timesOffered" name="times_offered" placeholder="Enter Number of Times Offered" required>
          </div>

          <!-- Duration -->
          <div class="col-md-6 mb-3">
            <label for="duration" class="form-label fw-bold">Duration</label>
            <input type="text" class="form-control" id="duration" name="duration" placeholder="Enter Duration (e.g., 30 Hours)" required>
          </div>

          <!-- Students Enrolled -->
          <div class="col-md-6 mb-3">
            <label for="studentsEnrolled" class="form-label fw-bold">Students Enrolled</label>
            <input type="number" class="form-control" id="studentsEnrolled" name="students_enrolled" placeholder="Enter Students Enrolled" required>
          </div>

          <!-- Students Completed -->
          <div class="col-md-6 mb-3">
            <label for="studentsCompleted" class="form-label fw-bold">Students Completed</label>
            <input type="number" class="form-control" id="studentsCompleted" name="students_completed" placeholder="Enter Students Completed" required>
          </div>

          <!-- Supporting Document -->
          <div class="col-md-12 mb-3">
            <label for="document" class="form-label fw-bold">Upload Supporting Document</label>
            <input type="file" class="form-control" id="document" name="document" accept=".pdf,.jpg,.png,.jpeg">
          </div>
        </div>

        <!-- Buttons -->
        <div class="form-footer">
          <button type="button" class="btn btn-danger px-4" onclick="window.history.back();">Cancel</button>
          <button type="submit" class="btn btn-primary px-4">Save</button>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
