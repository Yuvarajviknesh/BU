{% extends "base.html" %}
{% block content %}
<style>
  .card-container {
    max-width: 700px;
    margin: 50px auto;
    background: #ffffff;
    padding: 20px;
    border-radius: 10px;
    box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
    margin-bottom: 120px;
  }
  .card-header {
    background-color: #002d6b;
    color: white;
    text-align: center;
    font-size: 20px;
    font-weight: bold;
    padding: 15px;
    border-top-left-radius: 10px;
    border-top-right-radius: 10px;
  }
  .form-container {
    padding: 20px;
  }
  .form-footer {
    margin-top: 20px;
    display: flex;
    justify-content: center;
    gap: 10px;
  }
</style>

<div class="container">
  <div class="card-container">
    <div class="card-header">
      Add Teacher Fellowship/Financial Support
    </div>
    <div class="card-body form-container">
      <form id="addFellowshipForm" method="post" action="">
        {% csrf_token %}
        <div class="row">
          <div class="col-md-12 mb-3">
            <label for="teacher_name" class="form-label fw-bold">Name of the Teacher</label>
            <input type="text" class="form-control" name="teacher_name" id="teacher_name" placeholder="Enter teacher's name" required>
          </div>
          <div class="col-md-12 mb-3">
            <label for="award_name" class="form-label fw-bold">Name of the Award/Fellowship</label>
            <input type="text" class="form-control" name="award_name" id="award_name" placeholder="Enter award/fellowship name" required>
          </div>
          <div class="col-md-6 mb-3">
            <label for="award_year" class="form-label fw-bold">Year of Award</label>
            <input type="number" class="form-control" name="award_year" id="award_year" placeholder="Enter year" required>
          </div>
          <div class="col-md-6 mb-3">
            <label for="award_agency" class="form-label fw-bold">Awarding Agency</label>
            <input type="text" class="form-control" name="award_agency" id="award_agency" placeholder="Enter awarding agency" required>
          </div>
          <div class="col-md-12 mb-3">
            <label for="recognition_level" class="form-label fw-bold">Recognition Level</label>
            <select class="form-control" name="recognition_level" id="recognition_level" required>
              <option value="">Select Recognition Level</option>
              <option value="National">National</option>
              <option value="International">International</option>
            </select>
          </div>
        </div>
        <div class="form-footer">
          <button type="button" class="btn btn-danger px-4" onclick="window.history.back();">Cancel</button>
          <button type="submit" class="btn btn-primary px-4">Save</button>
        </div>
      </form>
    </div>
  </div>
</div>

{% endblock %}
