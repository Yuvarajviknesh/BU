{% extends "base.html" %}
{% block content %}
<style>
  .card-container {
    max-width: 900px;
    margin: 50px auto;
    background: #ffffff;
    padding: 20px;
    border-radius: 10px;
    box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
    margin-bottom: 120px;
  }
  .card-header {
    background-color: #002d6b;
    color: white;
    text-align: center;
    font-size: 20px;
    font-weight: bold;
    padding: 15px;
    border-top-left-radius: 10px;
    border-top-right-radius: 10px;
  }
  .form-container {
    padding: 20px;
  }
  .form-footer {
    margin-top: 20px;
    display: flex;
    justify-content: center;
    gap: 10px;
  }
  .input-group {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .input-group button {
    margin-left: 10px;
    background-color: #007bff;
    color: white;
    border: none;
    border-radius: 5px;
    padding: 6px 12px;
  }
  .input-group button:hover {
    background-color: #0056b3;
  }
  .investor-container {
    margin-top: 10px;
  }
  .investor-container input {
    margin-bottom: 5px;
  }
  .remove-investor {
    color: red;
    font-size: 18px;
    cursor: pointer;
  }
  .remove-investor:hover {
    color: darkred;
  }
  .input-group select, .form-control {
    width: 100%;
  }
</style>

<div class="container">
  <div class="card-container">
    <div class="card-header">
      Add Research Grants and Recognitions
    </div>
    <div class="card-body form-container">
      <form id="addResearchGrantForm" method="post" action="">
        {% csrf_token %}
        <div class="row">
          <div class="col-md-12 mb-3">
            <label for="scheme_name" class="form-label fw-bold">Name of the Scheme/Project/Endowments/Chairs</label>
            <input type="text" class="form-control" name="scheme_name" id="scheme_name" placeholder="Enter scheme/project name" required>
          </div>
          <div class="col-md-12 mb-3">
            <label for="investor" class="form-label fw-bold">Principal Investigator/Co-Investigator</label>
            <div class="input-group">
              <input type="text" class="form-control" name="investor[]" id="investor" placeholder="Enter investigator's name" required>
              <button type="button" class="btn" onclick="addInvestor()">Add Investor</button>
            </div>
            <div id="investorList" class="investor-container"></div>
          </div>
          <div class="col-md-12 mb-3">
            <label for="funding_agency" class="form-label fw-bold">Name of the Funding Agency</label>
            <input type="text" class="form-control" name="funding_agency" id="funding_agency" placeholder="Enter funding agency" required>
          </div>
          <div class="col-md-6 mb-3">
            <label for="type" class="form-label fw-bold">Type (Government/Non-Government)</label>
            <select class="form-control" name="type" id="type" required>
              <option value="">Select Type</option>
              <option value="Government">Government</option>
              <option value="Non-Government">Non-Government</option>
            </select>
          </div>
          <div class="col-md-6 mb-3">
            <label for="department" class="form-label fw-bold">Department</label>
            <input type="text" class="form-control" name="department" id="department" value="{{ user.department }}" readonly>
          </div>
          <div class="col-md-6 mb-3">
            <label for="year_of_award" class="form-label fw-bold">Year of Award</label>
            <input type="number" class="form-control" name="year_of_award" id="year_of_award" placeholder="Enter year" required>
          </div>
          <div class="col-md-6 mb-3">
            <label for="funds_provided" class="form-label fw-bold">Funds Provided (INR in Lakhs)</label>
            <input type="number" class="form-control" name="funds_provided" id="funds_provided" placeholder="Enter funds" required>
          </div>
          <div class="col-md-12 mb-3">
            <label for="duration" class="form-label fw-bold">Duration of the Project</label>
            <div class="input-group">
              <input type="number" class="form-control" name="duration" id="duration" placeholder="Enter duration" required>
              <select class="form-control" name="duration_unit" id="duration_unit" required>
                <option value="Months">Months</option>
                <option value="Years">Years</option>
              </select>
            </div>
          </div>
        </div>
        <div class="form-footer">
          <button type="button" class="btn btn-danger px-4" onclick="window.history.back();">Cancel</button>
          <button type="submit" class="btn btn-primary px-4">Save</button>
        </div>
      </form>
    </div>
  </div>
</div>

<script>
  function addInvestor() {
    const investorList = document.getElementById("investorList");
    const investorInput = document.createElement('div');
    investorInput.classList.add('input-group');
    
    const newInput = document.createElement('input');
    newInput.type = 'text';
    newInput.classList.add('form-control');
    newInput.name = 'investor[]';
    newInput.placeholder = "Enter another investigator's name";
    
    const removeButton = document.createElement('span');
    removeButton.innerHTML = '×';
    removeButton.classList.add('remove-investor');
    removeButton.onclick = function() {
      investorInput.remove();
    };
    
    investorInput.appendChild(newInput);
    investorInput.appendChild(removeButton);
    investorList.appendChild(investorInput);
  }
</script>

{% endblock %}
