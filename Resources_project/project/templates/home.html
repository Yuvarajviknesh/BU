{% extends 'base.html' %}

{% block title %}Home Page{% endblock %}

{% block content %}
<style>
/* Main Container */
.main {
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    gap: 20px;
    padding: 20px;
    margin: 0 auto;
    max-width: 100%;
    margin-top: 30px;
}

/* Title Styling */
.title {
    text-align: center;
    font-size: 22px;
    font-weight: bold;
    color: #002d6b;
    margin-top: 20px;
    margin-bottom: 20px;
}

/* Card Styles */
.card {
    background-color: #002d6b;
    color: white;
    text-align: center;
    padding: 20px;
    flex: 1 1 calc(33.3% - 40px); /* 4 cards in a row with gap */
    min-width: 250px;
    height: 220px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 10px;
    font-size: 18px;
    font-weight: bold;
    text-decoration: none;
    overflow: hidden;
    word-wrap: break-word;
    cursor: pointer;
    transition: transform 0.3s ease-in-out, box-shadow 0.3s ease-in-out, color 0.3s ease-in-out;
}

.card a {
    text-decoration: none;
    color: white;
}

/* Hover Effect */
.card:hover {
    transform: scale(1.05);
    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
}

.card:hover a {
    color: #f4a641;
}

/* Responsive Adjustments */
@media (max-width: 1024px) {
    .card {
        flex: 1 1 calc(50% - 40px); /* 2 cards per row on medium screens */
    }
}

@media (max-width: 600px) {
    .card {
        flex: 1 1 calc(100% - 40px); /* 1 card per row on small screens */
    }
}

</style>

<!-- Title Outside the Main Container -->
<h2 class="title">Criteria Overview</h2>

<div class="main">
    <div class="card">
        <a href="{% url 'criterion_page' 1 %}">
            Criterion 1
        </a>
    </div>
    <div class="card">
        <a href="{% url 'criterion_page' 2 %}">
            Criterion 2
        </a>
    </div>
    <div class="card">
        <a href="{% url 'criterion_page' 3 %}">
            Criterion 3
        </a>
    </div>
    <div class="card">
        <a href="{% url 'criterion_page' 4 %}">
            Criterion 4
        </a>
    </div>
    <div class="card">
        <a href="{% url 'criterion_page' 5 %}">
            Criterion 5
        </a>
    </div>
    <div class="card">
        <a href="{% url 'criterion_page' 6 %}">
            Criterion 6
        </a>
    </div>
</div>
<div class="main"></div>
{% endblock %}
