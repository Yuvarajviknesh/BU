<!-- ✅ Filter Block Styling -->
<style>
    /* Filter Container */
    .filter-container {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        align-items: center;
        gap: 20px;
        padding: 15px;
        background-color: #ff9800;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
        position:sticky;
        width: 100%;
        z-index: 999;
    }

    /* Dropdown Wrapper */
    .dropdown-wrapper {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
    }

    /* Dropdown Labels */
    .filter-container label {
        font-weight: bold;
        margin-bottom: 5px;
        font-size: 14px;
        color: #333;
    }

    /* Dropdown Styling */
    .filter-container select {
        width: 250px;
        padding: 10px;
        font-size: 14px;
        border: 1px solid #ddd;
        border-radius: 5px;
        background: white;
        cursor: pointer;
        transition: 0.3s;
    }

    /* Responsive */
    @media (max-width: 768px) {
        .filter-container {
            flex-direction: column;
            align-items: center;
        }

        .filter-container select {
            width: 100%;
        }
    }
</style>

<!-- ✅ Filter Form -->
<form method="GET" class="filter-container">
    <!-- Department Dropdown -->
    <div class="dropdown-wrapper">
        <label for="department">Department:</label>
        <select name="department" id="department" onchange="this.form.submit()">
            <option value="" {% if not selected_department %}selected{% endif %}>All Departments</option>
            {% for dept in departments %}
                <option value="{{ dept.department_code }}" {% if selected_department == dept.department_code %}selected{% endif %}>
                    {{ dept.department_name }}
                </option>
            {% endfor %}
        </select>
    </div>

    <!-- Criterion Title Dropdown -->
    <div class="dropdown-wrapper">
        <label for="criterion_title">Title:</label>
        <select name="criterion_title" id="criterion_title" onchange="redirectToPage()">
            <option value="">Select Title</option>
            {% if criterion_id == 3 %}
                <option value="{% url 'teacher_awards_list' %}" {% if request.resolver_match.url_name == 'teacher_awards_list' %}selected{% endif %}>Incentives for Teachers</option>
                <option value="{% url 'research_grants_list' %}" {% if request.resolver_match.url_name == 'research_grants_list' %}selected{% endif %}>Grants for Research</option>
                <option value="{% url 'award_list' %}" {% if request.resolver_match.url_name == 'award_list' %}selected{% endif %}>Awards/Recognitions for Research Innovations</option>
                <option value="{% url 'patent_list' %}" {% if request.resolver_match.url_name == 'patent_list' %}selected{% endif %}>Patents Published/Awarded During the Year</option>
                <option value="{% url 'phd_list' %}" {% if request.resolver_match.url_name == 'phd_list' %}selected{% endif %}>Ph.D.s Awarded Per Teacher</option>
                <option value="{% url 'form6' %}" {% if request.resolver_match.url_name == 'form6' %}selected{% endif %}>Research Papers in UGC Journals</option>
                <option value="{% url 'form7' %}" {% if request.resolver_match.url_name == 'form7' %}selected{% endif %}>Books and Chapters Published</option>
            {% elif criterion_id == 4 %}
                <option value="{% url 'ict_facility_list' %}" {% if request.resolver_match.url_name == 'ict_facility_list' %}selected{% endif %}>ICT Facilities</option>
                <option value="{% url 'library_resources' %}" {% if request.resolver_match.url_name == 'library_resources' %}selected{% endif %}>E-Library Resources</option>
                <option value="{% url 'expenditure_list' %}" {% if request.resolver_match.url_name == 'expenditure_list' %}selected{% endif %}>Expenditure on Facilities</option>
                <option value="{% url 'show_econtent' %}" {% if request.resolver_match.url_name == 'show_econtent' %}selected{% endif %}>E-Content Development</option>
            {% endif %}
        </select>
    </div>
</form>

<!-- ✅ JavaScript for Redirection -->
<script>
function redirectToPage() {
    const titleDropdown = document.getElementById("criterion_title");
    const selectedURL = titleDropdown.value;
    if (selectedURL) {
        window.location.href = selectedURL;
    }
}
</script>
