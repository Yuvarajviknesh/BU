{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="shortcut icon" href="{% static 'images/bu_logo_icon.png' %}" type="image/x-icon">
    {% comment %} <link rel="stylesheet" href="{% static 'styles/home.css' %}"> {% endcomment %}
    <style>
        /* General Styles */
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            margin: 0;
            padding: 0;
        }
        
        /* Header Styles */
        .header {
            background-color: #002d6b;
            color: white;
            padding: 15px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            top: 0;
        }
        
        .logo {
            height: 60px;
        }
        
        /* User Info (Desktop) */
        .user-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        
        .username {
            color: white;
            font-size: 16px;
        }
        
        .logout-btn {
            text-decoration: none;
            color: white;
            font-size: 16px;
            background-color: #f4a641;
            padding: 5px 10px;
            border-radius: 5px;
        }
        
        .logout-btn:hover {
            background-color: #ff8800;
        }
        
        /* Mobile Navbar */
        @media (max-width: 768px) {
            .user-info {
                display: none; /* Hide username & logout on small screens */
            }
        
            .navbar-toggler {
                background-color: white;
                color: #002d6b;
                font-size: 24px;
                border: none;
                padding: 5px 10px;
                border-radius: 5px;
            }
        
            /* Full-width dropdown menu */
            .fullwidth-menu {
                width: 100%;
                background-color: #002d6b;
                text-align: center;
                padding: 10px 0;
            }
        
            .menu-content {
                display: flex;
                flex-direction: column;
                gap: 10px;
            }
        
            .fullwidth-menu .username {
                color: white;
                font-size: 18px;
            }
        
            .fullwidth-menu .logout-btn {
                color: white;
                font-size: 16px;
                background-color: #f4a641;
                padding: 8px 15px;
                border-radius: 5px;
                text-decoration: none;
            }
        }
        
        /* Footer Styles */
        .footer {
            background-color: #002d6b;
            color: white;
            text-align: center;
            padding: 10px 0;
            position: fixed;
            bottom: 0;
            width: 100%;
        }
        
        .footer a {
            color: #f4a641;
            text-decoration: none;
        }
        
        .footer a:hover {
            text-decoration: underline;
        }
        
        /* Login Section */
        .login-section {
            margin: 80px auto;
            max-width: 400px;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.1);
        }
        
        .login-section h2 {
            text-align: center;
            color: #002d6b;
        }
        
        /* Button Styles */
        .btn-primary {
            background-color: #002d6b;
            border: none;
        }
        
        .btn-primary:hover {
            background-color: #f4a641;
            border: none;
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="d-flex align-items-center justify-content-center">
            <img src="{% static 'images/logo2.png' %}" alt="Bharathiar University" style="max-height: 60px;">
        </div>
    </header>

    <!-- Show Messages -->
    {% if messages %}
        <div class="toast-container position-fixed top-0 end-0 p-3">
            {% for message in messages %}
                <div class="toast" role="alert" aria-live="assertive" aria-atomic="true">
                    <div class="toast-header">
                        <strong class="me-auto">Notification</strong>
                        <button type="button" class="btn-close" data-bs-dismiss="toast" aria-label="Close"></button>
                    </div>
                    <div class="toast-body {% if message.tags == 'error' %}text-bg-danger{% elif message.tags == 'success' %}text-bg-success{% else %}text-bg-info{% endif %}">
                        {{ message }}
                    </div>
                </div>
            {% endfor %}
        </div>
    {% endif %}

    <!-- Login Section -->
    <section class="login-section">
        <h2 class="text-center">Login</h2>

        <form action="{% url 'login' %}" method="POST">
            {% csrf_token %}
            <div class="mb-3">
                <label for="email" class="form-label">Email Address</label>
                <input type="email" class="form-control" id="email" name="email" placeholder="Enter your email" required>
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input type="password" class="form-control" id="password" name="password" placeholder="Enter your password" required>
            </div>
            <div class="d-grid">
                <button type="submit" class="btn btn-primary">Login</button>
            </div>
        </form>
    </section>

    <!-- Footer -->
    <footer class="footer">
        <p>&copy; 2025 Bharathiar University. All Rights Reserved. <a href="#">Privacy Policy</a></p>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- JavaScript for Toast -->
    <script>
        // Enable toasts to show up automatically
        document.addEventListener('DOMContentLoaded', function () {
            var toastElements = document.querySelectorAll('.toast');
            var toastList = [...toastElements].map(toast => new bootstrap.Toast(toast));
            toastList.forEach(toast => toast.show());
        });
    </script>
</body>
</html>
